<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="tbCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00B8D9" />
      <stop offset="100%" stop-color="#174EA6" />
    </linearGradient>
    <linearGradient id="tbGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem: Aerodynamic High-Speed Locomotive Nose & Dual Rails -->
  <g transform="translate(10, 8)">
    <!-- Rail Tracks Base -->
    <path d="M 5 88 L 88 88" stroke="#174EA6" stroke-width="3" stroke-linecap="round" />
    <path d="M 12 94 L 92 94" stroke="#00B8D9" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <!-- Track Sleepers -->
    <line x1="20" y1="84" x2="16" y2="96" stroke="#174EA6" stroke-width="2.5" />
    <line x1="38" y1="84" x2="34" y2="96" stroke="#174EA6" stroke-width="2.5" />
    <line x1="56" y1="84" x2="52" y2="96" stroke="#174EA6" stroke-width="2.5" />
    <line x1="74" y1="84" x2="70" y2="96" stroke="#174EA6" stroke-width="2.5" />

    <!-- Streamline Aerodynamic Train Body -->
    <path d="M 10 74 C 18 55, 38 25, 78 12 C 86 9, 94 8, 96 8 C 94 20, 88 40, 86 52 C 84 65, 78 74, 60 74 Z" 
          fill="url(#tbCyanGrad)" />

    <!-- Locomotive Windshield (Dark Glass with Cyan Accent) -->
    <path d="M 46 36 C 54 26, 68 18, 76 16 C 75 24, 71 34, 69 38 C 60 40, 52 39, 46 36 Z" 
          fill="#101D35" stroke="#00B8D9" stroke-width="1.5" />

    <!-- Dynamic Speed Lines / Cowcatcher Accents -->
    <path d="M 18 78 L 76 78" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 28 82 L 82 82" stroke="#FF6B00" stroke-width="2.5" stroke-linecap="round" />

    <!-- Dual Headlights (Gleaming white/cyan) -->
    <circle cx="28" cy="71" r="3.5" fill="#FFFFFF" filter="url(#cyanGlow)" />
    <circle cx="44" cy="71" r="3.5" fill="#FFFFFF" filter="url(#cyanGlow)" />
  </g>

  <!-- Typography: TB PRO -->
  <g transform="translate(118, 20)">
    <!-- TB text in Bold Pristine White -->
    <text x="0" y="52" 
          font-family="'Josefin Sans', 'Arial Black', sans-serif" 
          font-size="54" 
          font-weight="800" 
          fill="#FFFFFF" 
          letter-spacing="2">TB</text>

    <!-- PRO Badge with Electric Cyan & Orange Accent -->
    <g transform="translate(90, 8)">
      <rect x="0" y="0" width="112" height="48" rx="8" 
            fill="url(#tbCyanGrad)" />
      <rect x="1.5" y="1.5" width="109" height="45" rx="6.5" 
            fill="#101D35" />
      <text x="56" y="34" 
            font-family="'Josefin Sans', 'Arial Black', sans-serif" 
            font-size="32" 
            font-weight="900" 
            fill="#00B8D9" 
            letter-spacing="3" 
            text-anchor="middle">PRO</text>
      <!-- Small orange lightning / speed dot -->
      <circle cx="102" cy="12" r="3" fill="#FF6B00" />
    </g>

    <!-- Subtitle: Indian Railways • LHB Coaches • MSTS • Open Rails -->
    <text x="2" y="74" 
          font-family="'Josefin Sans', sans-serif" 
          font-size="11" 
          font-weight="600" 
          fill="#00B8D9" 
          letter-spacing="2.2">INDIAN RAILWAYS</text>
    
    <circle cx="132" cy="71" r="2" fill="#FF6B00" />
    
    <text x="140" y="74" 
          font-family="'Josefin Sans', sans-serif" 
          font-size="11" 
          font-weight="600" 
          fill="#F4F7FB" 
          letter-spacing="1.5">LHB COACHES</text>

    <circle cx="242" cy="71" r="2" fill="#00B8D9" />

    <text x="250" y="74" 
          font-family="'Josefin Sans', sans-serif" 
          font-size="11" 
          font-weight="600" 
          fill="#94A3B8" 
          letter-spacing="1.5">MSTS &amp; OPEN RAILS</text>
  </g>
</svg>
